<!doctype html>
<!-- htmx.org's GitHub star button (buttons.github.io), framed: buttons.js replaces its link in place, which would move every element Markless resumes by DOM position. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star bigskysoftware/htmx on GitHub</title>
<style>html, body { margin: 0; overflow: hidden; background: transparent; }</style>
</head>
<body>
<a class="github-button" href="https://github.com/bigskysoftware/htmx" data-color-scheme="no-preference: light; light: light; dark: dark;" data-icon="octicon-star" data-show-count="true" aria-label="Star bigskysoftware/htmx on GitHub" target="_top">star</a>
<script async defer src="https://buttons.github.io/buttons.js"></script>
</body>
</html>
