<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sign in | Lighthouse Walks</title>
		<meta name="description" content="Sign in to your walker account." />
		<meta name="robots" content="noindex" />
		<link rel="canonical" href="https://lighthouse.example/login/" />
		<meta property="og:title" content="Sign in | Lighthouse Walks" />
		<meta property="og:description" content="Sign in to your walker account." />
		<meta property="og:url" content="https://lighthouse.example/login/" />
		<meta property="og:image" content="https://lighthouse.example/hero.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="/hero.png" type="image/png" />
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<header>
			<span class="brand"><img class="logo" src="/logo-2024.png" alt="" width="32" height="32" />Lighthouse Walks</span>
			<nav aria-label="Main">
				<a href="/">Home</a>
				<a href="/about/">About</a>
				<a href="/fr/" hreflang="fr">Français</a>
				<a href="/ar/" hreflang="ar">العربية</a>
			</nav>
		</header>
		<main>
			<h1>Sign in</h1>
			<p role="alert" data-login-error hidden>Wrong email or password.</p>
			<form method="post" action="/api/login" class="subscribe">
				<label for="login-email">Email</label>
				<input id="login-email" type="email" name="email" autocomplete="email" required />
				<label for="login-password">Password</label>
				<input id="login-password" type="password" name="password" autocomplete="current-password" required />
				<button type="submit">Sign in</button>
			</form>
		</main>
		<footer>
			<p>Page rendered at <time data-rendered-at></time></p>
		</footer>
	</body>
</html>
