name: Setup
description: Node, pnpm, dependencies and the Playwright browsers the checker drives
inputs:
  browsers:
    description: Playwright browsers to install, space-separated
    default: chromium
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.14.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    # Caches are saved on main only: a pull request's copy is visible to that pull request alone, and those copies pushed
    # the repository past its 10 GB cache limit (10.5 GB on 2026-10-27), which evicted main's and sent jobs to the mirror.
    # A set with no cache of its own restores a warmed set holding all its browsers and more (scripts/browser-cache-sets.ts).
    - id: sets
      env:
        BROWSERS: ${{ inputs.browsers }}
        PREFIX: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-
        APT_PREFIX: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-
      run: |
        sets=(); while IFS= read -r s; do sets+=("$s"); done < <(node scripts/browser-cache-sets.ts "$BROWSERS")
        { echo 'browsers<<EOF'; for s in "${sets[@]}"; do echo "$PREFIX$s"; done; echo EOF
          echo 'apt<<EOF'; echo "$APT_PREFIX$BROWSERS-"; for s in "${sets[@]}"; do echo "$APT_PREFIX$s-"; done; echo EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache/restore@v4
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
        restore-keys: ${{ steps.sets.outputs.browsers }}
    # The browsers' system packages, as apt downloaded them: the runners' mirror has served them at 30 kB/s, past a job's
    # 45 minutes (165 kB/s, 12 minutes for 119 MB, on 2026-10-27). The newest main entry is restored.
    - uses: actions/cache/restore@v4
      id: apt-cache
      with:
        path: ~/.cache/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.sets.outputs.apt }}
    # A cache restored from a superset is never saved under this set's key: it would carry the superset's extra browsers.
    - id: restored
      env:
        BROWSERS: ${{ inputs.browsers }}
        PREFIX: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-
        APT_PREFIX: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-
        BROWSERS_KEY: ${{ steps.browsers.outputs.cache-matched-key }}
        APT_KEY: ${{ steps.apt-cache.outputs.cache-matched-key }}
      run: |
        own=true
        for kind in browsers apt; do
          if [ "$kind" = browsers ]; then key=$BROWSERS_KEY; [ "$key" = "$PREFIX$BROWSERS" ] && mine=true || mine=false
          else key=$APT_KEY; [[ "$key" == "$APT_PREFIX$BROWSERS-"* ]] && mine=true || mine=false; fi
          if [ -z "$key" ]; then echo "$kind for '$BROWSERS': no cache, downloading"
          elif [ "$mine" = true ]; then echo "$kind for '$BROWSERS': restored from its own cache $key"
          else
            echo "$kind for '$BROWSERS': restored from superset cache $key"
            if [ "$kind" = apt ]; then own=false; fi
          fi
        done
        echo "apt-own=$own" >> "$GITHUB_OUTPUT"
      shell: bash
    # The runner's packages.microsoft.com source has answered 403, failing the browsers' apt-get update; they need nothing from it.
    # AWS-hosted runners list us-east-2.ec2.archive.ubuntu.com first, which served 0.55 MB/s on 2026-11-18 (azure.archive.ubuntu.com: 18-110 MB/s from the same runners).
    - id: apt
      run: |
        { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -f
        if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i -E 's#^https?://[^/]*\.ec2\.archive\.ubuntu\.com/ubuntu/#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/apt-mirrors.txt && head -1 /etc/apt/apt-mirrors.txt; fi
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded > /dev/null
        mkdir -p ~/.cache/apt-archives
        if compgen -G ~/.cache/apt-archives/'*.deb' > /dev/null; then sudo cp ~/.cache/apt-archives/*.deb /var/cache/apt/archives/; fi
        echo "before=$(find ~/.cache/apt-archives -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      shell: bash
    # Each mirror in /etc/apt/apt-mirrors.txt gets one attempt of at most 3 minutes; a stall or failure moves to the next one.
    - run: node scripts/apt-mirror-fallback.ts -- pnpm exec playwright install-deps ${{ inputs.browsers }}
      shell: bash
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: timeout 600 pnpm exec playwright install ${{ inputs.browsers }}
      shell: bash
    - id: kept
      if: always()
      run: |
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} ~/.cache/apt-archives/ \;
        echo "new=$(( $(find ~/.cache/apt-archives -name '*.deb' | wc -l) - ${{ steps.apt.outputs.before || 0 }} ))" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: steps.browsers.outputs.cache-matched-key == '' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
    - if: always() && steps.kept.outputs.new > 0 && steps.restored.outputs.apt-own == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}-${{ github.run_id }}-${{ github.run_attempt }}
