name: Setup
description: Node, pnpm, dependencies and the Playwright browsers the checker drives
inputs:
  browsers:
    description: Playwright browsers to install, space-separated
    default: chromium
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.14.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v4
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps ${{ inputs.browsers }}
      shell: bash
