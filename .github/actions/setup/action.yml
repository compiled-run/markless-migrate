name: Setup
description: Node, pnpm, dependencies and the Playwright browsers the checker drives
inputs:
  browsers:
    description: Playwright browsers to install, space-separated
    default: chromium
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.14.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    # Caches are saved on main only: a pull request's copy is visible to that pull request alone, and those copies pushed
    # the repository past its 10 GB cache limit (10.5 GB on 2026-10-27), which evicted main's and sent jobs to the mirror.
    - uses: actions/cache/restore@v4
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
    # The browsers' system packages, as apt downloaded them: the runners' mirror has served them at 30 kB/s, past a job's
    # 45 minutes (165 kB/s, 12 minutes for 119 MB, on 2026-10-27). The newest main entry is restored.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}-
    # The runner's packages.microsoft.com source has answered 403, failing the browsers' apt-get update; they need nothing from it.
    - id: apt
      run: |
        { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -f
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded > /dev/null
        mkdir -p ~/.cache/apt-archives
        if compgen -G ~/.cache/apt-archives/'*.deb' > /dev/null; then sudo cp ~/.cache/apt-archives/*.deb /var/cache/apt/archives/; fi
        echo "before=$(find ~/.cache/apt-archives -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: timeout 1200 pnpm exec playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: timeout 1200 pnpm exec playwright install-deps ${{ inputs.browsers }}
      shell: bash
    - id: kept
      if: always()
      run: |
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} ~/.cache/apt-archives/ \;
        echo "new=$(( $(find ~/.cache/apt-archives -name '*.deb' | wc -l) - ${{ steps.apt.outputs.before || 0 }} ))" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: steps.browsers.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
    - if: always() && steps.kept.outputs.new > 0 && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}-${{ github.run_id }}-${{ github.run_attempt }}
