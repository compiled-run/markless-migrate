name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Four shards: with journeys after in-place arrival and each route's 3.5 s look at what moves on its own, shard 1 of 3 measured 30 min, its whole budget.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The slowest unit test takes about 6 minutes on a runner; one stuck past 10 fails by name instead of holding the shard until it is cancelled.
      # A shard takes at most 15 minutes; one still running at 20 prints what each Node process under it is stuck on, then fails.
      - run: bash scripts/ci-watchdog.sh node --test --test-timeout=600000 --test-shard=${{ matrix.shard }}/4 test/*.test.ts

  e2e:
    name: E2E ${{ matrix.suite }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: convert-compiles
          - suite: dev-builds
          - suite: embeds
          - suite: markless-site
          - suite: motion
          - suite: nav-parity
          - suite: page-load
          - suite: proxy
          - suite: radix-dialog-port
          - suite: responsiveness
          - { suite: slow-network, browsers: chromium firefox webkit }
          - { suite: next-app, shard: 1/6 }
          - { suite: next-app, shard: 2/6 }
          - { suite: next-app, shard: 3/6 }
          - { suite: next-app, shard: 4/6 }
          - { suite: next-app, shard: 5/6 }
          - { suite: next-app, shard: 6/6 }
          - { suite: vite-site, shard: 1/4 }
          - { suite: vite-site, shard: 2/4 }
          - { suite: vite-site, shard: 3/4 }
          - { suite: vite-site, shard: 4/4 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers || 'chromium' }}
      - run: node --test test/e2e/${{ matrix.suite }}.test.ts
        env:
          E2E_SHARD: ${{ matrix.shard }}

  passed:
    name: CI passed
    if: always()
    needs: [typecheck, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
