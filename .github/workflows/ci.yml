name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A main push and a merge queue group get a group of their own: a shared group cancels the waiting run whenever a newer merge lands.
concurrency:
  group: ci-${{ github.event_name != 'pull_request' && format('{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No e2e suite reads examples/, deploy/ or docs/, so a pull request touching only those (or Markdown) skips them; main always runs every suite.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      actions: read
    outputs:
      e2e: ${{ steps.files.outputs.e2e }}
      tested: ${{ steps.queue.outputs.tested }}
    steps:
      # A commit the merge queue fast-forwarded main to was already tested whole, at this exact SHA.
      - id: queue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&status=success&head_sha=$GITHUB_SHA" --jq '.workflow_runs[0].html_url // empty')
          if [ -n "$run" ]; then echo tested=true >> "$GITHUB_OUTPUT"; echo "Every suite already passed on this commit in the merge queue: $run" >> "$GITHUB_STEP_SUMMARY"; else echo tested=false >> "$GITHUB_OUTPUT"; fi
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo e2e=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          reach=$(printf '%s\n' "$files" | grep -Ev '^(examples|deploy|docs)/|\.md$' || true)
          if [ -n "$reach" ]; then echo e2e=true >> "$GITHUB_OUTPUT"; else echo e2e=false >> "$GITHUB_OUTPUT"; fi
          echo "e2e suites run: $([ -n "$reach" ] && echo yes || echo 'no, only examples/, deploy/, docs/ or Markdown changed')" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # With the five short e2e jobs, one pull request holds at most 11 of the org's 60 runners, for about 15 minutes.
      max-parallel: 5
      matrix:
        # Each file's shard is its entry in scripts/unit-shards.json (docs/ci-process.md, "Unit shards"); the count here is the list's.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A test stuck past 10 minutes fails by name; a shard still running at 20 prints what each Node process under it is stuck on, then fails.
      - run: bash scripts/ci-watchdog.sh node scripts/unit-shards.ts run ${{ matrix.shard }}/5

  e2e:
    name: E2E ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Suites of 0 to 4 minutes share a runner, one file after another, instead of each paying its own setup.
          - { suite: quick, files: convert-compiles dev-builds markless-site proxy waste responsiveness nav-parity layout-owners }
          - { suite: pages, files: motion scroll-and-dialogs page-load radix-dialog-port embeds original-dataset }
          - { suite: networks, files: slow-network late-fonts busy-cpu state-engines, browsers: chromium firefox webkit }
          - { suite: shadcn, files: shadcn-typeset shadcn-create judge-offline, browsers: chromium webkit }
          - { suite: parity, files: control-parity touch, browsers: chromium webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers || 'chromium' }}
      - run: |
          files=()
          for suite in $SUITES; do files+=("test/e2e/$suite.test.ts"); done
          node --test --test-concurrency=1 "${files[@]}"
        env:
          SUITES: ${{ matrix.files || matrix.suite }}

  # The checker's own time and memory on a fixed page, base against head on one runner (scripts/check-budget.ts states the bounds).
  budget:
    name: Check budget
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .budget-base
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      - run: |
          pnpm install --frozen-lockfile --dir .budget-base
          (cd .budget-base && timeout 1200 pnpm exec playwright install chromium firefox webkit)
      - run: |
          node scripts/check-budget.ts measure .budget-base "$RUNNER_TEMP/base.json"
          node scripts/check-budget.ts measure . "$RUNNER_TEMP/head.json"
          node scripts/check-budget.ts compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  # A convert's peak memory, and its CPU time beside a fixed reference tree on the same runner (scripts/convert-budget.ts states the bounds).
  convert-budget:
    name: Convert budget
    needs: changes
    if: needs.changes.outputs.tested != 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The limits are main's, so a change that edits them is judged by main's values and says so.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha || (github.event_name == 'push' && github.event.before) || 'main' }}
          path: .budget-main
          sparse-checkout: scripts/convert-budget.json
          sparse-checkout-cone-mode: false
      - id: limits
        run: |
          file=.budget-main/scripts/convert-budget.json
          if [ ! -f "$file" ]; then echo "main has no scripts/convert-budget.json yet: this change's own limits are used"; file=scripts/convert-budget.json; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./$file').reference.commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        id: reference
        continue-on-error: true
        with:
          ref: ${{ steps.limits.outputs.commit }}
          path: .budget-reference
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v4
        id: reference-modules
        with:
          path: .budget-reference/node_modules
          key: convert-budget-reference-${{ runner.os }}-${{ steps.limits.outputs.commit }}
      - id: reference-install
        if: steps.reference.outcome == 'success' && steps.reference-modules.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile --dir .budget-reference
      - if: steps.reference-install.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .budget-reference/node_modules
          key: convert-budget-reference-${{ runner.os }}-${{ steps.limits.outputs.commit }}
      - run: node scripts/convert-budget.ts judge .budget-reference . "${{ steps.limits.outputs.file }}"

  # The checker's mutation suites were 60% of a pull request's runner time; they run in the merge queue and on main.
  mutation:
    name: E2E ${{ matrix.suite }} (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    # Corpus shard 1 holds "the original against itself", every micro-site page in one check: 35 to 40 min on main before
    # phone taps; with them the other corpus shards ran 14 to 22 min where they had run 11 to 16, and shard 1 passed 45.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { suite: next-app, shard: 1/6 }
          - { suite: next-app, shard: 2/6 }
          - { suite: next-app, shard: 3/6 }
          - { suite: next-app, shard: 4/6 }
          - { suite: next-app, shard: 5/6 }
          - { suite: next-app, shard: 6/6 }
          - { suite: vite-site, shard: 1/4 }
          - { suite: vite-site, shard: 2/4 }
          - { suite: vite-site, shard: 3/4 }
          - { suite: vite-site, shard: 4/4 }
          # The owner's hand-found shadcn bugs, each put back into a micro-site page: check must report every one.
          - { suite: corpus, shard: 1/4, browsers: chromium webkit }
          - { suite: corpus, shard: 2/4, browsers: chromium webkit }
          - { suite: corpus, shard: 3/4, browsers: chromium webkit }
          - { suite: corpus, shard: 4/4, browsers: chromium webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers || 'chromium' }}
      - run: node --test --test-concurrency=1 "test/e2e/$SUITE.test.ts"
        env:
          SUITE: ${{ matrix.suite }}
          E2E_SHARD: ${{ matrix.shard }}

  passed:
    name: CI passed
    if: always()
    needs: [changes, typecheck, unit, e2e, budget, convert-budget, mutation]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$TESTED" = true ]; then exit 0; fi
          test "$TYPECHECK" = success
          test "$UNIT" = success
          if [ "$E2E_WANTED" = true ]; then test "$E2E" = success; else test "$E2E" = skipped; fi
          if [ "$E2E_WANTED" = true ] && [ "$EVENT" != push ]; then test "$BUDGET" = success; fi
          if [ "$E2E_WANTED" = true ]; then test "$CONVERT_BUDGET" = success; fi
          if [ "$EVENT" = pull_request ]; then test "$MUTATION" = skipped; elif [ "$E2E_WANTED" = true ]; then test "$MUTATION" = success; fi
        env:
          EVENT: ${{ github.event_name }}
          TESTED: ${{ needs.changes.outputs.tested }}
          E2E_WANTED: ${{ needs.changes.outputs.e2e }}
          CHANGES: ${{ needs.changes.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          BUDGET: ${{ needs.budget.result }}
          CONVERT_BUDGET: ${{ needs.convert-budget.result }}
          MUTATION: ${{ needs.mutation.result }}
