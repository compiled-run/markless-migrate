name: inline css remeasure
on:
  push:
    branches: [scratch/inline-css-remeasure]
env:
  INPUTS: https://github.com/compiled-run/markless-migrate/releases/download/scratch-inline-css-inputs/remeasure-inputs.tgz
  ROUTE: /docs/headless/accordion/
jobs:
  packs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            ref: 93b3265ce34a866e8b124564a6c5204e512c535b
          - name: after
            ref: 5f09f4464b8011a5ab1216bd216a647a76dad0b8
    steps:
      - uses: actions/checkout@v4
        with: { path: harness, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: compiled-run/markless, ref: '${{ matrix.ref }}', path: markless, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: compiled-run/markless-ecosystem-ci, path: ecosystem-ci, persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: markless/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: markless/pnpm-lock.yaml }
      - run: node ecosystem-ci/ecosystem-ci.ts build --markless-dir markless --packs packs
      - uses: actions/upload-artifact@v4
        with: { name: 'packs-${{ matrix.name }}', path: packs, retention-days: 3 }
      - name: website html
        working-directory: markless
        run: |
          NITRO_PRESET=cloudflare-module pnpm --dir website build > /tmp/website-build.log 2>&1 || (tail -40 /tmp/website-build.log; exit 1)
          node ../harness/scratch-inline-css/html-sizes.cjs website/.output/public /tmp/website-html.json
      - uses: actions/upload-artifact@v4
        with: { name: 'website-html-${{ matrix.name }}', path: /tmp/website-html.json, retention-days: 3 }
  port:
    needs: packs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: 'packs-${{ matrix.side }}', path: packs }
      - name: inputs
        run: curl -fsSL "$INPUTS" | tar -xz -C /tmp && ls /tmp/inputs
      - name: build
        run: |
          set -e
          app=/tmp/inputs/qwikui-markless
          mkdir -p $app/.markless-local && cp packs/*.tgz $app/.markless-local/ && rm -f $app/.markless-local/markless-vitest-browser-*.tgz
          node $app/scripts/link-markless.mjs "$app" "$app/.markless-local"
          if [ "${{ matrix.side }}" = after ]; then node scratch-inline-css/import-route-styles.mjs "$app" "$ROUTE" pages/docs/headless/accordion.tsrx; fi
          cd $app && npm install --no-audit --no-fund > /tmp/install.log 2>&1 || (tail -40 /tmp/install.log; exit 1)
          npx vp build > /tmp/build.log 2>&1 || (tail -80 /tmp/build.log; exit 1)
          tail -5 /tmp/build.log
          mkdir -p /tmp/site && rsync -a public/ /tmp/site/ && rsync -a .output/public/ /tmp/site/ && find /tmp/site \( -name "*.br" -o -name "*.gz" \) -delete
          node $GITHUB_WORKSPACE/scratch-inline-css/html-sizes.cjs /tmp/site /tmp/port-html.json
          tar -czf /tmp/site-${{ matrix.side }}.tgz -C /tmp site
      - uses: actions/upload-artifact@v4
        with: { name: 'site-${{ matrix.side }}', path: '/tmp/site-${{ matrix.side }}.tgz', retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: 'port-html-${{ matrix.side }}', path: /tmp/port-html.json, retention-days: 3 }
  measure:
    needs: port
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund > /tmp/ci.log 2>&1 || (tail -30 /tmp/ci.log; exit 1)
      - run: npx playwright install --with-deps ${{ matrix.browser }} > /tmp/pw.log 2>&1 || (tail -30 /tmp/pw.log; exit 1)
      - uses: actions/download-artifact@v4
        with: { pattern: 'site-*', path: /tmp/sites, merge-multiple: true }
      - name: serve
        run: |
          set -e
          S=/tmp/serve; mkdir -p $S/caddy-data
          curl -fsSL "$INPUTS" | tar -xz -C /tmp && mv /tmp/inputs/qwik-client $S/qwik
          for side in before after; do mkdir -p $S/x-$side && tar -xzf /tmp/sites/site-$side.tgz -C $S/x-$side && mv $S/x-$side/site $S/markless-$side; done
          curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz | tar -xz -C /tmp caddy
          cd $S && openssl req -x509 -newkey rsa:2048 -nodes -keyout test.key -out test.crt -days 3 -subj "/CN=maieul.test" -addext "subjectAltName=DNS:qwik.test,DNS:markless-before.test,DNS:markless-after.test" -addext "extendedKeyUsage=serverAuth" 2>/dev/null
          { printf '{\n\tadmin off\n\tauto_https disable_redirects\n\tskip_install_trust\n\tstorage file_system %s/caddy-data\n\tservers {\n\t\tprotocols h1 h2\n\t}\n}\n(common) {\n\ttls %s/test.crt %s/test.key\n\tencode gzip\n\theader /build/* Cache-Control "public, max-age=31536000, immutable"\n\tfile_server\n}\n' $S $S $S
            for n in qwik markless-before markless-after; do printf 'https://%s.test:8443 {\n\troot * %s/%s\n\timport common\n}\n' $n $S $n; done; } > Caddyfile
          /tmp/caddy version; /tmp/caddy validate --config Caddyfile
          nohup /tmp/caddy run --config Caddyfile > caddy.log 2>&1 &
          sleep 2
      - name: parity
        if: matrix.browser == 'chromium'
        run: node scratch-inline-css/parity.mjs "https://markless-before.test:8443$ROUTE" "https://markless-after.test:8443$ROUTE" | tee /tmp/parity.txt
      - name: matrix
        run: |
          mkdir -p /tmp/data
          node src/check/maieul-run.ts --urls https://markless-after.test:8443$ROUTE,https://markless-before.test:8443$ROUTE,https://qwik.test:8443$ROUTE --profiles regular-3g,slow-4g,fast --browsers ${{ matrix.browser }} --runs 7 --out /tmp/data/matrix-${{ matrix.browser }}.jsonl 2>&1 | tail -80
          node -e 'const os=require("os"); console.log(os.cpus()[0].model, os.cpus().length, "cpus", Math.round(os.totalmem()/2**30), "GB")' | tee /tmp/data/machine-${{ matrix.browser }}.txt
          cp /tmp/parity.txt /tmp/data/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'data-${{ matrix.browser }}', path: /tmp/data, retention-days: 7 }
