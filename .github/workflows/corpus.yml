name: Corpus

# The bugs the owner found by hand in the ui.shadcn.com port (deploy/shadcn-ui/corpus/bugs.json), checked on the kept port
# builds that still have them, against the old site built from its source: a check change that stops reporting any of them
# is red. Each runner checks one route as check.yml's shards do, with the flags a site's run uses, page load left out (no
# corpus bug is a load bug). The micro-site corpus (test/e2e/corpus.test.ts) runs in ci.yml's merge queue instead.
on:
  push:
    branches: [main]
    paths:
      - src/check/**
      - src/cli.ts
      - scripts/corpus.ts
      - deploy/shadcn-ui/corpus/**
      - deploy/shadcn-ui/ci-serve.sh
      - .github/workflows/corpus.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: shadcn-ui
  APP: examples/shadcn-ui-markless
  OLD: http://localhost:4000
  NEW: http://127.0.0.1:3000

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        run: echo "matrix=$(node scripts/corpus.ts matrix deploy/shadcn-ui/corpus/bugs.json)" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    name: ${{ matrix.build }} ${{ matrix.route }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      - uses: oven-sh/setup-bun@v2
      - name: Restore the old site's build
        id: old-build
        uses: actions/cache/restore@v4
        with:
          path: |
            deploy/${{ env.SITE }}/old
            !deploy/${{ env.SITE }}/old/**/.next/cache
          key: old-site-${{ env.SITE }}-${{ hashFiles(format('deploy/{0}/fetch-old.sh', env.SITE)) }}
      - name: Serve the old site
        run: bash "deploy/$SITE/ci-serve.sh" old
      - name: Serve the port build that has the bug
        run: bash "deploy/$SITE/ci-serve.sh" new "$URL"
        env:
          URL: ${{ matrix.url }}
      - name: Check
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -uo pipefail
          cd "$APP"
          status=0
          # A fresh old side every run (--no-cache): what the corpus measures is today's check, not a kept result.
          node "$GITHUB_WORKSPACE/src/cli.ts" check --old "$OLD" --new "$NEW" --route "$ROUTE" --site-targets ../../deploy/shadcn-ui/check-targets.json --control-webkit --busy-cpu --no-load --no-cache --timeout 7200 > "$RUNNER_TEMP/check.txt" 2>&1 || status=$?
          tail -n 40 "$RUNNER_TEMP/check.txt"
          # 1 is red and 4 a partial run, the results; 3 is a route not checked, which verify reports as such.
          [ "$status" -eq 0 ] || [ "$status" -eq 1 ] || [ "$status" -eq 3 ] || [ "$status" -eq 4 ] || exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.key }}
          path: |
            ${{ env.APP }}/.migrate/report.json
            ${{ runner.temp }}/check.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: [plan, check]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-*
          path: reports
      - name: Every corpus bug is reported
        run: |
          set -euo pipefail
          # Each build's reports under reports/<build>/, as verify reads them.
          for dir in reports/corpus-*; do build="${dir#reports/corpus-}"; build="${build%-*}"; mkdir -p "by-build/$build"; mv "$dir" "by-build/$build/"; done
          status=0
          node scripts/corpus.ts verify deploy/shadcn-ui/corpus/bugs.json by-build > table.md || status=$?
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          exit "$status"
