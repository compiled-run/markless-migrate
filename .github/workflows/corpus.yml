name: Corpus

# The bugs the owner found by hand in the ui.shadcn.com port (deploy/shadcn-ui/corpus/bugs.json), checked on the kept port
# builds that still have them, against the old site built from its source: a check change that stops reporting any of them
# is red. Each build's bug routes are checked through check.yml, as a site's run checks them (one route a shard, a route
# longer than its timeout sliced, page load left out: no corpus bug is a load bug), each shard judged again from the
# observations it recorded. The micro-site corpus (test/e2e/corpus.test.ts) runs in ci.yml's merge queue instead. With
# rows_from, no build is checked: an earlier run's recorded observations are judged again by this commit's judges and scored.
on:
  push:
    branches: [main]
    paths:
      - src/check/**
      - src/cli.ts
      - scripts/corpus.ts
      - deploy/shadcn-ui/corpus/**
      - deploy/shadcn-ui/ci-serve.sh
      - .github/workflows/corpus.yml
  workflow_dispatch:
    inputs:
      rows_from:
        description: A corpus run whose recorded observations are judged again and scored, instead of checking the builds
        required: false
        default: ''

permissions:
  contents: read

env:
  SITE: shadcn-ui
  APP: examples/shadcn-ui-markless
  OLD: http://localhost:4000
  NEW: http://127.0.0.1:3000

# On main every commit's run lands its score (they queue); on a branch a newer push replaces the run in progress.
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    if: ${{ !inputs.rows_from }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        run: echo "builds=$(node scripts/corpus.ts builds deploy/shadcn-ui/corpus/bugs.json)" >> "$GITHUB_OUTPUT"

  # A fresh old side every run (no reuse): what the corpus measures is today's check, not a kept result.
  check:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      site: shadcn-ui
      app: examples/shadcn-ui-markless
      targets: deploy/shadcn-ui/corpus/targets-${{ matrix.build }}.json
      shards: ${{ matrix.shards }}
      build: ${{ matrix.url }}
      flags: --no-load --no-cache
      timeout: '7200'
      reuse: ${{ 'false' }}
      artifacts: corpus-${{ matrix.build }}-

  verify:
    needs: [plan, check]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-*-check-merged
          path: reports
      - name: Every corpus bug is reported
        run: |
          set -euo pipefail
          # Each build's merged report under by-build/<build>/, as verify reads it.
          for dir in reports/corpus-*-check-merged; do build="${dir#reports/corpus-}"; build="${build%-check-merged}"; mkdir -p "by-build/$build"; mv "$dir" "by-build/$build/"; done
          status=0
          node scripts/corpus.ts verify deploy/shadcn-ui/corpus/bugs.json by-build > table.md || status=$?
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          exit "$status"

  rescore:
    if: ${{ inputs.rows_from }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The recorded observations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.rows_from }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'corpus-*-check-observations-*' -D recorded
      - name: Every corpus bug is reported, judged from the recorded observations
        env:
          RUN: ${{ inputs.rows_from }}
        run: |
          set -euo pipefail
          # Each artifact's observations judged by this commit, its report under by-build/<build>/<artifact>/, as verify reads them.
          for dir in recorded/corpus-*-check-observations-*; do
            name="${dir#recorded/}"; build="${name#corpus-}"; build="${build%-check-observations-*}"
            if [ ! -f "$dir/observations.tar.zst" ]; then echo "::warning::$name holds no observations"; continue; fi
            observations="$dir/observations"
            mkdir -p "$observations"
            zstd -q -d --long=27 -c "$dir/observations.tar.zst" | tar -xf - -C "$observations"
            # 1 is a red report, which is what the judged routes of a corpus build are.
            judged=0; node src/cli.ts check judge "$observations" --out "by-build/$build/$name" || judged=$?
            [ "$judged" -le 1 ] || exit "$judged"
          done
          status=0
          node scripts/corpus.ts verify deploy/shadcn-ui/corpus/bugs.json by-build > table.md || status=$?
          { echo "Judged from the observations run $RUN recorded."; echo; cat table.md; } >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          exit "$status"

