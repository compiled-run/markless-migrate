name: Layout survey

# The site's shared layout controls, surveyed on the original only, and which route exercises each (src/check/layout-survey.ts):
# check.yml's shards read it, and the pipeline's check-select keys each route by what it exercises. Uploads
# <artifacts>check-layout-survey.
on:
  workflow_call:
    inputs:
      site: { type: string, required: true }
      app: { type: string, required: true }
      targets: { type: string, required: true }
      original: { type: string, required: true }
      flags: { type: string, required: false, default: '' }
      concurrency: { type: string, required: false, default: '' }
      artifacts: { type: string, required: false, default: '' }

permissions:
  contents: read
  actions: read

env:
  SITE: ${{ inputs.site }}
  APP: ${{ inputs.app }}
  TARGETS: ${{ inputs.targets }}
  OLD: http://localhost:4000

jobs:
  # Every shard reads the same survey, so a route explores the same journeys whichever shard it is dealt to. Each slice surveys
  # the routes dealt to it in turn, one at a time as a single survey would, and `join` joins them in the site's order.
  survey-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
      - name: The original
        uses: ./.github/actions/old-site
        with:
          site: ${{ env.SITE }}
          step: restore
          id: ${{ inputs.original }}
          token: ${{ github.token }}
      - name: Serve the old site
        run: bash "deploy/$SITE/ci-serve.sh" old
      - name: Survey the site's layout, one slice
        env:
          FLAGS: ${{ inputs.flags }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          node scripts/check-shards.ts split "$TARGETS" 4 "$RUNNER_TEMP/slices" > /dev/null
          # A site of fewer pages than slices leaves a slice with none: it has nothing to survey.
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).routes.length ? 0 : 1)' "$RUNNER_TEMP/slices/shard-$SLICE.json" || exit 0
          cd "$APP"
          mkdir -p "$RUNNER_TEMP/survey"
          # pipeline.yml's check-select keys reuse by these options too (CHECK_ARGS): an option added here goes there.
          # shellcheck disable=SC2086
          node "$GITHUB_WORKSPACE/src/cli.ts" check --old "$OLD" --new "$OLD" --targets "$RUNNER_TEMP/slices/shard-$SLICE.json" --site-targets "$GITHUB_WORKSPACE/$TARGETS" --write-layout-survey "$RUNNER_TEMP/survey/layout-survey-$SLICE.json" $(node "$GITHUB_WORKSPACE/scripts/ci-flags.ts" check "$CONCURRENCY") $FLAGS --no-cache
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-layout-survey-${{ matrix.slice }}
          path: ${{ runner.temp }}/survey
          retention-days: 14

  join:
    needs: survey-slice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifacts }}check-layout-survey-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true
      - name: Join the slices
        run: |
          mkdir -p "$RUNNER_TEMP/survey"
          node scripts/check-shards.ts survey-join "$TARGETS" "$RUNNER_TEMP/survey/layout-survey.json" "$RUNNER_TEMP"/slices/layout-survey-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-layout-survey
          path: ${{ runner.temp }}/survey
          retention-days: 14
