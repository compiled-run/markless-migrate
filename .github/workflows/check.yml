name: Check

# `markless-migrate check` of a port split by route across runners. Each runner serves both sides itself, never a
# deployment: the old site built from its source and the port from a build archive, through the site's
# deploy/<site>/ci-serve.sh (`old`, and `new <archive URL>`). A --write-targets file is dealt into shards, each runner
# checks one, and a last job joins their reports.
on:
  workflow_dispatch:
    inputs:
      site:
        description: The deploy/<site> folder whose ci-serve.sh serves both sides
        required: true
        default: shadcn-ui
      app:
        description: The port's folder (where .migrate/ goes)
        required: true
        default: examples/shadcn-ui-markless
      build:
        description: URL of the port's build (a .tar.gz of its .output, node-server preset)
        required: true
      targets:
        description: A `check --all --write-targets` file in the repository
        required: true
        default: deploy/shadcn-ui/check-targets.json
      shards:
        description: Runners to split the routes across
        required: true
        default: '24'
      flags:
        description: Extra check flags
        required: false
        default: ''
      concurrency:
        description: Routes checked at once on each runner (2 cores; a heavy page wants one)
        required: false
        default: '1'
      timeout:
        description: Seconds one route may take (a page's journey budget grows with its controls)
        required: false
        default: '3600'
      reuse:
        description: Reuse each route's last result while it ships the same HTML and code ('false' checks every route)
        required: false
        default: 'true'
      max_parallel:
        description: Shards run at once, at most 10 (the org runs 60 jobs; leave room for every repository's CI)
        required: false
        default: '10'
  # The pipeline workflow's check stage: its build artifact, and the routes its selection left to check.
  workflow_call:
    inputs:
      site: { type: string, required: true }
      app: { type: string, required: true }
      targets: { type: string, required: true }
      shards: { type: string, required: true }
      flags: { type: string, required: false, default: '' }
      build-artifact:
        description: An artifact of this repository holding output.tar.gz, served instead of the build URL
        type: string
        required: false
        default: ''
      build-url:
        type: string
        required: false
        default: ''
      only-artifact:
        description: An artifact of this run holding targets.json, the routes to deal into shards (targets stays the whole site's)
        type: string
        required: false
        default: ''
      reuse:
        type: string
        required: false
        default: 'true'
      matrix:
        description: The shard list, when the caller dealt the routes itself (its check-shards artifact); it then merges the shards' reports too
        type: string
        required: false
        default: ''
  # Never on pull requests: a change to this workflow is tried with `gh workflow run check.yml --ref <branch>`.

permissions:
  contents: read
  actions: read

env:
  SITE: ${{ inputs.site || 'shadcn-ui' }}
  APP: ${{ inputs.app || 'examples/shadcn-ui-markless' }}
  BUILD: ${{ inputs.build || 'https://github.com/compiled-run/markless-migrate/releases/download/shadcn-ui-subset-build-6f528da/shadcn-ui-markless-output.tar.gz' }}
  TARGETS: ${{ inputs.targets || 'deploy/shadcn-ui/check-targets-subset.json' }}
  SHARDS: ${{ inputs.shards || '13' }}
  OLD: http://localhost:4000
  NEW: http://127.0.0.1:3000

concurrency:
  group: check-${{ inputs.build-artifact || inputs.build || github.ref }}-${{ inputs.targets }}-${{ inputs.flags }}
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.matrix == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cap the shards run at once
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel || '10' }}
        run: |
          case "$MAX_PARALLEL" in ''|*[!0-9]*) echo "::error::max_parallel must be a whole number from 1 to 10, got '$MAX_PARALLEL'"; exit 1 ;; esac
          if [ "$MAX_PARALLEL" -lt 1 ] || [ "$MAX_PARALLEL" -gt 10 ]; then echo "::error::max_parallel must be from 1 to 10, got $MAX_PARALLEL"; exit 1; fi
      - if: inputs.only-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.only-artifact }}
          path: ${{ runner.temp }}/only
      - id: split
        run: echo "matrix=$(node scripts/check-shards.ts split "${{ inputs.only-artifact != '' && format('{0}/only/targets.json', runner.temp) || env.TARGETS }}" "$SHARDS" shards)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: check-shards
          path: shards
          retention-days: 3

  check:
    needs: plan
    if: ${{ !cancelled() && (inputs.matrix != '' || needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 h: the old site's build takes about 25 minutes, the shard the rest.
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # The org runs 60 jobs at once: a check leaves room for every other repository's CI.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '10') }}
      matrix:
        shard: ${{ fromJSON(inputs.matrix || needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The slow network is measured in all three: a port slower only in Firefox or WebKit is red, not skipped.
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      # The old site's own build scripts call bun (ui.shadcn.com's registry:build).
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: check-shards
          path: ${{ runner.temp }}/shards
      # The old site as an earlier job built it: a Next.js build differs from the last in every file name, so without this each
      # shard serves a different deploy and nothing check keeps of the old side survives to the next run.
      - name: Restore the old site's build
        id: old-build
        uses: actions/cache/restore@v4
        with:
          path: |
            deploy/${{ env.SITE }}/old
            !deploy/${{ env.SITE }}/old/**/.next/cache
          key: old-site-${{ env.SITE }}-${{ hashFiles(format('deploy/{0}/fetch-old.sh', env.SITE)) }}
      - name: Serve the old site
        run: bash "deploy/$SITE/ci-serve.sh" old
      - name: Keep the old site's build
        if: steps.old-build.outputs.cache-hit != 'true' && hashFiles(format('deploy/{0}/old/.ci-built', env.SITE)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            deploy/${{ env.SITE }}/old
            !deploy/${{ env.SITE }}/old/**/.next/cache
          key: old-site-${{ env.SITE }}-${{ hashFiles(format('deploy/{0}/fetch-old.sh', env.SITE)) }}
      - name: Serve the port
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build-artifact }}" ]; then
            bash scripts/pipeline-artifact.sh build "${{ inputs.build-artifact }}" "${{ inputs.build-url }}" "$RUNNER_TEMP/build"
            BUILD="file://$RUNNER_TEMP/build/output.tar.gz"
          fi
          bash "deploy/$SITE/ci-serve.sh" new "$BUILD"
      # The old side's captures, journeys and slow-network runs from this shard's earlier runs. Check reuses an entry only while
      # its own code and the old site are unchanged (every response the old page loaded, or the files its HTML names).
      - name: Restore the old side from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.APP }}/.migrate/cache/old
            ${{ env.APP }}/.migrate/slow-network
          key: check-old-${{ env.SITE }}-${{ hashFiles(env.TARGETS) }}-${{ env.SHARDS }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: check-old-${{ env.SITE }}-${{ hashFiles(env.TARGETS) }}-${{ env.SHARDS }}-${{ matrix.shard }}-
      # Results of earlier runs, by what each route ships: its served HTML and the code hash of every module it can run.
      - name: Restore results from earlier runs
        if: inputs.reuse != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APP }}/.migrate/reuse
          key: check-reuse-${{ env.SITE }}-${{ github.run_id }}
          restore-keys: check-reuse-${{ env.SITE }}-
      - name: Check
        env:
          SHARD: ${{ matrix.shard }}
          FLAGS: ${{ inputs.flags }}
          CONCURRENCY: ${{ inputs.concurrency || '1' }}
          TIMEOUT: ${{ inputs.timeout || '3600' }}
          REUSE: ${{ inputs.reuse != 'false' && '--reuse .migrate/reuse' || '' }}
        run: |
          set -uo pipefail
          cd "$APP"
          mkdir -p .migrate/cache/old .migrate/slow-network
          # Wherever the preset put it: .vercel/output/.markless/static/, or under .output/ for node-server and cloudflare-module.
          closures=$(find "$RUNNER_TEMP/new" -path '*/.markless/static/interaction-closures.json' | head -n 1)
          [ -z "$REUSE" ] || REUSE="$REUSE --closures ${closures:-$RUNNER_TEMP/new/.vercel/output/.markless/static/interaction-closures.json}"
          status=0
          # Template groups are made over the whole site, so page load, visual, responsiveness and motion run on one page per group of the site, not of each shard.
          # --busy-cpu: each representative's controls are also used with the runner's CPUs kept busy, in all three engines.
          # shellcheck disable=SC2086
          node "$GITHUB_WORKSPACE/src/cli.ts" check --old "$OLD" --new "$NEW" --targets "$RUNNER_TEMP/shards/shard-$SHARD.json" --site-targets "$GITHUB_WORKSPACE/$TARGETS" --concurrency "$CONCURRENCY" --timeout "$TIMEOUT" --control-webkit --busy-cpu $REUSE $FLAGS > "$RUNNER_TEMP/check.txt" 2>&1 || status=$?
          tail -n 40 "$RUNNER_TEMP/check.txt"
          # 1 is a red route and 4 a partial run, which is what a shard is: both are results, reported by the merge.
          [ "$status" -eq 0 ] || [ "$status" -eq 1 ] || [ "$status" -eq 3 ] || [ "$status" -eq 4 ] || exit "$status"
      - name: Keep the old side for later runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.APP }}/.migrate/cache/old
            ${{ env.APP }}/.migrate/slow-network
          key: check-old-${{ env.SITE }}-${{ hashFiles(env.TARGETS) }}-${{ env.SHARDS }}-${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.shard }}
          path: |
            ${{ env.APP }}/.migrate/report.json
            ${{ env.APP }}/.migrate/check-progress
            ${{ env.APP }}/.migrate/reuse
            ${{ runner.temp }}/check.txt
            ${{ runner.temp }}/new-serve.log
            ${{ runner.temp }}/old-serve.log
            ${{ runner.temp }}/old-build.log
          if-no-files-found: warn
          retention-days: 14

  merge:
    needs: [plan, check]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/check-merge
        with:
          site: ${{ env.SITE }}
          label: ${{ env.BUILD }}
          shards: ${{ env.SHARDS }}
          reuse: ${{ inputs.reuse }}
