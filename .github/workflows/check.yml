name: Check

# `markless-migrate check` of a port split by route across runners. Each runner serves both sides itself, never a
# deployment: the old site built from its source and the port from a build archive, through the site's
# deploy/<site>/ci-serve.sh (`old`, and `new <archive URL>`). A --write-targets file is dealt into shards, each runner
# checks one, and a last job joins their reports.
on:
  workflow_dispatch:
    inputs:
      priority:
        description: deploy (tonight's deploy run) skips the full-site gate and does not count against its two slots; otherwise leave empty
        required: false
        default: ''
      site:
        description: The deploy/<site> folder whose ci-serve.sh serves both sides
        required: true
        default: shadcn-ui
      app:
        description: The port's folder (where .migrate/ goes)
        required: true
        default: examples/shadcn-ui-markless
      build:
        description: URL of the port's build (a .tar.gz of its .output or .vercel/output); empty is the site's newest <site>-deployed-build-* or <site>-build-* release
        required: false
      targets:
        description: A `check --all --write-targets` file in the repository
        required: true
        default: deploy/shadcn-ui/check-targets.json
      shards:
        description: Runners to split the routes across
        required: true
        default: '24'
      flags:
        description: Extra check flags
        required: false
        default: ''
      concurrency:
        description: Routes checked at once on each runner (2 cores; a heavy page wants one; default src/check/ci-settings.ts)
        required: false
        default: ''
      timeout:
        description: Seconds one route may take (a page's journey budget grows with its controls; default src/check/ci-settings.ts)
        required: false
        default: ''
      reuse:
        description: Reuse each route's last result while it ships the same HTML and code ('false' checks every route)
        required: false
        default: 'true'
      max_parallel:
        description: Shards run at once, at most 10 (the org runs 60 jobs; leave room for every repository's CI), or 24 with priority deploy
        required: false
        default: '10'
      dataset:
        description: "'true' reads the old side's loads and journeys from the original's dataset (original.yml) instead of observing them"
        required: false
        default: 'false'
      preset:
        description: The Nitro preset the build was made with (cloudflare-module to check the exact build a Cloudflare deploy uploads); empty serves whatever the archive holds
        required: false
        default: ''
  # The pipeline workflow's check stage: its build artifact, and the routes its selection left to check.
  workflow_call:
    inputs:
      site: { type: string, required: true }
      app: { type: string, required: true }
      targets: { type: string, required: true }
      shards: { type: string, required: true }
      flags: { type: string, required: false, default: '' }
      build-artifact:
        description: An artifact of this repository holding output.tar.gz, served instead of the build URL
        type: string
        required: false
        default: ''
      build-url:
        type: string
        required: false
        default: ''
      only-artifact:
        description: An artifact of this run holding targets.json, the routes to deal into shards (targets stays the whole site's)
        type: string
        required: false
        default: ''
      reuse:
        type: string
        required: false
        default: 'true'
      max_parallel: { type: string, required: false, default: '10' }
      priority: { type: string, required: false, default: '' }
      dataset: { type: string, required: false, default: 'false' }
      original:
        description: The originalId every shard serves (.github/actions/old-site); empty names the one published for this recipe, publishing it first when there is none
        type: string
        required: false
        default: ''
      preset: { type: string, required: false, default: '' }
      build: { type: string, required: false, default: '' }
      timeout: { type: string, required: false, default: '' }
      artifacts:
        description: A prefix for every artifact this run uploads and reads, so several calls in one workflow run keep theirs apart
        type: string
        required: false
        default: ''
  # Never on pull requests: a change to this workflow is tried with `gh workflow run check.yml --ref <branch>`.

permissions:
  contents: read
  actions: read

env:
  SITE: ${{ inputs.site || 'shadcn-ui' }}
  APP: ${{ inputs.app || 'examples/shadcn-ui-markless' }}
  TARGETS: ${{ inputs.targets || 'deploy/shadcn-ui/check-targets-subset.json' }}
  SHARDS: ${{ inputs.shards || '13' }}
  OLD: http://localhost:4000
  NEW: http://127.0.0.1:3000

concurrency:
  group: check-${{ inputs.build-artifact || inputs.build || github.ref }}-${{ inputs.targets }}-${{ inputs.flags }}
  cancel-in-progress: false

jobs:
  # At most two full-site runs (50 routes or more) at once across convert, check, pipeline and the probes, oldest first; the
  # rest wait here on one runner each instead of queueing their shards (docs/ci-process.md "Runners").
  gate:
    name: full-site gate
    if: github.workflow == 'Check'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: size
        name: Count the routes
        env:
          SPEC: ${{ inputs.priority == 'deploy' && 'priority:deploy' || env.TARGETS }}
        run: node scripts/full-site-gate.ts size "$SPEC" >> "$GITHUB_OUTPUT"
      - name: Wait for a full-site slot
        if: steps.size.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/full-site-gate.ts wait

  plan:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      sliced: ${{ steps.split.outputs.sliced }}
      replays: ${{ steps.split.outputs.replays }}
      build: ${{ steps.build.outputs.build }}
    steps:
      # A build named by its release key, never a fixed archive, so the default cannot fall behind what was deployed.
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.build }}
          ARTIFACT: ${{ inputs.build-artifact }}
        run: |
          build="$GIVEN"
          if [ -z "$build" ] && [ -z "$ARTIFACT" ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt --jq "[.[] | select(.tagName | startswith(\"$SITE-deployed-build-\") or startswith(\"$SITE-build-\"))] | sort_by(.createdAt) | last | .tagName // empty")
            [ -n "$tag" ] || { echo "::error::no $SITE-deployed-build-* or $SITE-build-* release: pass build"; exit 1; }
            build=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith(".tar.gz"))][0].url // empty')
            [ -n "$build" ] || { echo "::error::release $tag has no .tar.gz build"; exit 1; }
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build: ${build:-artifact $ARTIFACT}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # check-shards.ts reaches src/check modules that import packages (yuku), so the dependencies are installed.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cap the shards run at once
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel || '10' }}
          # A deploy run may hold every shard at once (docs/ci-process.md "Runners").
          CAP: ${{ inputs.priority == 'deploy' && '24' || '10' }}
        run: |
          case "$MAX_PARALLEL" in ''|*[!0-9]*) echo "::error::max_parallel must be a whole number from 1 to $CAP, got '$MAX_PARALLEL'"; exit 1 ;; esac
          if [ "$MAX_PARALLEL" -lt 1 ] || [ "$MAX_PARALLEL" -gt "$CAP" ]; then echo "::error::max_parallel must be from 1 to $CAP, got $MAX_PARALLEL"; exit 1; fi
      - if: inputs.only-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.only-artifact }}
          path: ${{ runner.temp }}/only
      # Each route's newest time in the last 10 checks that timed any route, however they ended (most full runs are cancelled or
      # stop at the step cap), packs the shards, longest first: each shard's route times, or the merged report of a run before them.
      - name: Earlier checks' route times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=0
          runs=$( { for wf in check.yml pipeline.yml corpus.yml; do gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" -L 30 --json databaseId,createdAt,status --jq '.[] | select(.status == "completed") | "\(.createdAt) \(.databaseId)"'; done; } | sort -r | cut -d' ' -f2)
          for run in $runs; do
            dir="$RUNNER_TEMP/earlier/$i"
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -p '*check-times-*' -D "$dir" 2>/dev/null && [ -n "$(find "$dir" -name route-times.json)" ]; then
              # shellcheck disable=SC2046
              node -e 'const fs=require("fs");const [out,...files]=process.argv.slice(1);fs.writeFileSync(out,JSON.stringify({routes:files.flatMap(f=>JSON.parse(fs.readFileSync(f,"utf8")).routes)}))' "$dir/report.json" $(find "$dir" -name route-times.json)
            elif ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n check-merged -D "$dir" 2>/dev/null; then rm -rf "$dir"; continue; fi
            echo "route times from run $run"
            i=$((i + 1))
            [ "$i" -lt 10 ] || break
          done
      # A route the last check says takes longer than a route may (--timeout) is checked in parts: one job explores it, its
      # journeys are replayed in slices by others, and a last job joins them by journey index and checks the rest.
      - id: split
        env:
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          over="${TIMEOUT:-$(node --input-type=module -e "import('./src/check/ci-settings.ts').then((m) => console.log(m.SHARD_CHECK.timeoutSeconds))")}"
          # shellcheck disable=SC2046
          matrix=$(node scripts/check-shards.ts split "${{ inputs.only-artifact != '' && format('{0}/only/targets.json', runner.temp) || env.TARGETS }}" "$SHARDS" shards $(for d in $(seq 0 9); do [ ! -f "$RUNNER_TEMP/earlier/$d/report.json" ] || echo "$RUNNER_TEMP/earlier/$d/report.json"; done) --slice-over "$over")
          {
            echo "matrix=$matrix"
            echo "sliced=$(node -p "JSON.stringify(require('./shards/sliced.json').map((r) => r.shard))")"
            echo "replays=$(node -p "JSON.stringify({ include: require('./shards/sliced.json').flatMap((r) => Array.from({ length: r.slices }, (_, i) => ({ shard: r.shard, at: i + 1, of: r.slices }))) })")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-shards
          path: shards
          retention-days: 3

  # The original every shard serves, by id: published once (.github/actions/old-site), so no shard or branch builds its own.
  original:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      id: ${{ inputs.original || steps.resolve.outputs.id || steps.publish.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        if: inputs.original == ''
        uses: ./.github/actions/old-site
        with:
          site: ${{ env.SITE }}
          step: resolve
          token: ${{ github.token }}
      - if: inputs.original == '' && steps.resolve.outputs.id == ''
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - if: inputs.original == '' && steps.resolve.outputs.id == ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: inputs.original == '' && steps.resolve.outputs.id == ''
        uses: oven-sh/setup-bun@v2
      - name: Build the old site
        if: inputs.original == '' && steps.resolve.outputs.id == ''
        run: bash "deploy/$SITE/ci-serve.sh" old
      - id: publish
        if: inputs.original == '' && steps.resolve.outputs.id == ''
        uses: ./.github/actions/old-site
        with:
          site: ${{ env.SITE }}
          step: publish
          token: ${{ github.token }}
      - env:
          ID: ${{ inputs.original || steps.resolve.outputs.id || steps.publish.outputs.id }}
        run: echo "Original $ID" >> "$GITHUB_STEP_SUMMARY"

  # Shared header and sidebar controls are each exercised by one route of the site, chosen from this survey of every page:
  # every shard reads the same one, so a route explores the same journeys whichever shard it is dealt to. Each slice surveys
  # the routes dealt to it in turn, one at a time as a single survey would, and `survey` joins them in the site's order.
  survey-slice:
    needs: original
    if: ${{ !cancelled() && needs.original.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
      - name: The original
        uses: ./.github/actions/old-site
        with:
          site: ${{ env.SITE }}
          step: restore
          id: ${{ needs.original.outputs.id }}
          token: ${{ github.token }}
      - name: Serve the old site
        run: bash "deploy/$SITE/ci-serve.sh" old
      - name: Survey the site's layout, one slice
        env:
          FLAGS: ${{ inputs.flags }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          node scripts/check-shards.ts split "$TARGETS" 4 "$RUNNER_TEMP/slices" > /dev/null
          # A site of fewer pages than slices leaves a slice with none: it has nothing to survey.
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).routes.length ? 0 : 1)' "$RUNNER_TEMP/slices/shard-$SLICE.json" || exit 0
          cd "$APP"
          mkdir -p "$RUNNER_TEMP/survey"
          # shellcheck disable=SC2086
          node "$GITHUB_WORKSPACE/src/cli.ts" check --old "$OLD" --new "$OLD" --targets "$RUNNER_TEMP/slices/shard-$SLICE.json" --site-targets "$GITHUB_WORKSPACE/$TARGETS" --write-layout-survey "$RUNNER_TEMP/survey/layout-survey-$SLICE.json" $(node "$GITHUB_WORKSPACE/scripts/ci-flags.ts" check "$CONCURRENCY") $FLAGS --no-cache
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-layout-survey-${{ matrix.slice }}
          path: ${{ runner.temp }}/survey
          retention-days: 14

  survey:
    needs: survey-slice
    if: ${{ !cancelled() && needs.survey-slice.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifacts }}check-layout-survey-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true
      - name: Join the slices
        run: |
          mkdir -p "$RUNNER_TEMP/survey"
          node scripts/check-shards.ts survey-join "$TARGETS" "$RUNNER_TEMP/survey/layout-survey.json" "$RUNNER_TEMP"/slices/layout-survey-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-layout-survey
          path: ${{ runner.temp }}/survey
          retention-days: 14

  check:
    needs: [plan, original, survey]
    # The gate is skipped when the pipeline calls this workflow, and a skipped job upstream skips this one unless it says otherwise.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.original.result == 'success' && needs.survey.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # The org runs 60 jobs at once: a check leaves room for every other repository's CI.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '10') }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps: &shard-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The slow network is measured in all three: a port slower only in Firefox or WebKit is red, not skipped.
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      # The old site's own build scripts call bun (ui.shadcn.com's registry:build).
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-shards
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-layout-survey
          path: ${{ runner.temp }}/survey
      # The original the original job named: a Next.js build differs from the last in every file name, so one published build is
      # what keeps every shard serving the same original.
      - name: The original
        uses: ./.github/actions/old-site
        with:
          site: ${{ env.SITE }}
          step: restore
          id: ${{ needs.original.outputs.id }}
          token: ${{ github.token }}
      - name: Serve the old site
        run: bash "deploy/$SITE/ci-serve.sh" old
      - name: Serve the port
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.plan.outputs.build }}
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build-artifact }}" ]; then
            bash scripts/pipeline-artifact.sh build "${{ inputs.build-artifact }}" "${{ inputs.build-url }}" "$RUNNER_TEMP/build"
            BUILD="file://$RUNNER_TEMP/build/output.tar.gz"
          fi
          bash "deploy/$SITE/ci-serve.sh" new "$BUILD"
      # The old side's captures, journeys and slow-network runs from this shard's earlier runs. Check reuses an entry only while
      # its own code and the old site are unchanged (every response the old page loaded, or the files its HTML names).
      # One cache for the whole site, joined by the merge job, so a route finds its old side whichever shard it lands on.
      - name: Restore the old side from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: old-joined
          key: check-old-joined-${{ env.SITE }}-${{ github.run_id }}
          restore-keys: check-old-joined-${{ env.SITE }}-
      - name: Place the old side
        run: |
          mkdir -p "$APP/.migrate/cache/old" "$APP/.migrate/slow-network"
          if [ -d old-joined/cache/old ]; then cp -R old-joined/cache/old/. "$APP/.migrate/cache/old/"; fi
          if [ -d old-joined/slow-network ]; then cp -R old-joined/slow-network/. "$APP/.migrate/slow-network/"; fi
          rm -rf old-joined
          # Entries written after this are what the shard recorded; the merge joins them with the restored ones.
          touch "$RUNNER_TEMP/old-placed" && sleep 1
      # Results of earlier runs, by what each route ships: its served HTML and the code hash of every module it can run.
      - name: Restore results from earlier runs
        if: inputs.reuse != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APP }}/.migrate/reuse
          key: check-reuse-${{ env.SITE }}-${{ github.run_id }}
          restore-keys: check-reuse-${{ env.SITE }}-
      # The original's dataset, by its id: the buckets of this shard's routes only.
      # A part of a sliced route reads what the parts before it wrote: the exploration, and for the joining part every slice.
      - name: The sliced route's earlier parts
        if: env.SLICE_IN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.SLICE_IN }}
          path: ${{ runner.temp }}/slice
          merge-multiple: true
      - name: The original's dataset
        if: inputs.dataset == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.original.outputs.id }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/original-dataset.ts download --tag "original-$SITE-${ID:0:12}" --targets "$RUNNER_TEMP/shards/shard-$SHARD.json" --out "$RUNNER_TEMP/dataset"
      # Stopped before the job's own limit, so the steps after it still upload each route the shard finished.
      - name: Check
        timeout-minutes: 320
        env:
          SHARD: ${{ matrix.shard }}
          FLAGS: ${{ inputs.flags }}
          CONCURRENCY: ${{ inputs.concurrency }}
          TIMEOUT: ${{ inputs.timeout }}
          REUSE: ${{ inputs.reuse != 'false' && '--reuse .migrate/reuse' || '' }}
          DATASET: ${{ inputs.dataset == 'true' && format('--original {0}/dataset', runner.temp) || '' }}
          # Each route's time per part (explore, replays, probes, slow network) in check.txt, to tell a slow route's cause.
          MARKLESS_MIGRATE_PROFILE: '1'
        run: |
          set -uo pipefail
          cd "$APP"
          mkdir -p .migrate/cache/old .migrate/slow-network
          # Wherever the preset put it: .vercel/output/.markless/static/, or under .output/ for node-server and cloudflare-module.
          closures=$({ find "$RUNNER_TEMP/new" "$GITHUB_WORKSPACE/$APP/.vercel/output" "$GITHUB_WORKSPACE/$APP/.output" -path '*/.markless/*/interaction-closures.json' 2>/dev/null || true; } | head -n 1)
          [ -z "$REUSE" ] || REUSE="$REUSE --closures ${closures:-$RUNNER_TEMP/new/.vercel/output/.markless/static/interaction-closures.json}"
          # A part of a sliced route holds that route alone, so the job's own limit, not a route's --timeout, bounds it.
          if [ -n "${SLICES:-}" ]; then REUSE=""; TIMEOUT="$SLICE_TIMEOUT"; SLICES="$SLICES --slice-dir $RUNNER_TEMP/slice"; fi
          status=0
          # Template groups and layout owners are made over the whole site, so page load, visual, responsiveness and motion run on one page per group of the site, and each shared control on one route of it.
          # --busy-cpu: each representative's controls are also used with the runner's CPUs kept busy, in all three engines.
          # shellcheck disable=SC2086
          node "$GITHUB_WORKSPACE/src/cli.ts" check --old "$OLD" --new "$NEW" --targets "$RUNNER_TEMP/shards/shard-$SHARD.json" --site-targets "$GITHUB_WORKSPACE/$TARGETS" --layout-survey "$RUNNER_TEMP/survey/layout-survey.json" $(node "$GITHUB_WORKSPACE/scripts/ci-flags.ts" check "$CONCURRENCY" "$TIMEOUT") $REUSE $DATASET ${SLICES:-} $FLAGS > "$RUNNER_TEMP/check.txt" 2>&1 || status=$?
          tail -n 40 "$RUNNER_TEMP/check.txt"
          # 1 is a red route and 4 a partial run, which is what a shard is: both are results, reported by the merge.
          [ "$status" -eq 0 ] || [ "$status" -eq 1 ] || [ "$status" -eq 3 ] || [ "$status" -eq 4 ] || exit "$status"
      # The rows the check recorded, judged again with no browser: a report they do not give back fails the shard (exit 6).
      - name: Judge again from the recorded observations
        if: env.PARTIAL != 'true'
        run: node src/cli.ts check judge "$APP/.migrate/observations" --report "$APP/.migrate/report.json"
      - name: What this part of the sliced route wrote
        if: always() && env.SLICE_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLICE_OUT }}
          path: ${{ runner.temp }}/slice
          if-no-files-found: error
          retention-days: 3
      # Every check leaves rows a later judge change can be scored on offline (check judge); zstd's long window shrinks their
      # near-alike text blobs about 3x past the artifact zip (docs/check.md).
      - name: Pack the observations
        if: always() && env.PARTIAL != 'true'
        run: |
          if [ -d "$APP/.migrate/observations" ]; then
            mkdir -p "$RUNNER_TEMP/observations"
            tar -cf - -C "$APP/.migrate/observations" . | zstd -q -T0 -3 --long=27 -o "$RUNNER_TEMP/observations/observations.tar.zst"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && env.PARTIAL != 'true'
        with:
          name: ${{ inputs.artifacts }}check-observations-${{ matrix.shard }}
          path: ${{ runner.temp }}/observations
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      # A few kB a later run's plan reads to pack its shards, kept apart from the shard's artifact so the plan downloads only this.
      - name: Route times
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/times"
          node scripts/check-shards.ts times "$APP/.migrate" "$RUNNER_TEMP/times/route-times.json" || true
      - uses: actions/upload-artifact@v4
        if: always() && env.PARTIAL != 'true'
        with:
          name: ${{ inputs.artifacts }}check-times-${{ matrix.shard }}
          path: ${{ runner.temp }}/times
          if-no-files-found: ignore
          retention-days: 30
      # The restored old-side entries are already in the joined cache the merge restores: uploading them again from every shard
      # was about 400 MB a shard (run 41318531000).
      - name: Keep only the old side this shard recorded
        if: always()
        run: find "$APP/.migrate/cache/old" "$APP/.migrate/slow-network" -type f ! -newer "$RUNNER_TEMP/old-placed" -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && env.PARTIAL != 'true'
        with:
          name: ${{ inputs.artifacts }}check-${{ matrix.shard }}
          path: |
            ${{ env.APP }}/.migrate/report.json
            ${{ env.APP }}/.migrate/check-progress
            ${{ env.APP }}/.migrate/reuse
            ${{ env.APP }}/.migrate/cache/old
            ${{ env.APP }}/.migrate/slow-network
            ${{ runner.temp }}/check.txt
            ${{ runner.temp }}/new-serve.log
            ${{ runner.temp }}/old-serve.log
            ${{ runner.temp }}/old-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # A sliced route's parts, each on a runner of its own with the check job's steps: explore, replay each slice, then join.
  slice-explore:
    needs: [plan, original, survey]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.original.result == 'success' && needs.survey.result == 'success' && needs.plan.outputs.sliced != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.sliced) }}
    env:
      PARTIAL: 'true'
      SLICES: --slices explore
      SLICE_OUT: ${{ inputs.artifacts }}slice-${{ matrix.shard }}-plan
      SLICE_TIMEOUT: '18000'
    steps: *shard-steps

  slice-replay:
    needs: [plan, original, survey, slice-explore]
    if: ${{ !cancelled() && needs.slice-explore.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '10') }}
      matrix: ${{ fromJSON(needs.plan.outputs.replays) }}
    env:
      PARTIAL: 'true'
      SLICES: --slices replay --slice ${{ matrix.at }}/${{ matrix.of }}
      SLICE_IN: ${{ inputs.artifacts }}slice-${{ matrix.shard }}-plan
      SLICE_OUT: ${{ inputs.artifacts }}slice-${{ matrix.shard }}-part-${{ matrix.at }}
      SLICE_TIMEOUT: '18000'
    steps: *shard-steps

  slice-finish:
    needs: [plan, original, survey, slice-replay]
    if: ${{ !cancelled() && needs.slice-replay.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.sliced) }}
    env:
      SLICES: --slices finish
      SLICE_IN: ${{ inputs.artifacts }}slice-${{ matrix.shard }}-*
      SLICE_TIMEOUT: '18000'
    steps: *shard-steps

  merge:
    needs: [plan, original, check, slice-finish]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    # A 90-shard merge took 1.7 min (run 41487965270); a 240-shard one reads about 3 GB of shard artifacts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the shard reports and shard files; the merge never reads check-observations-* (about 1 GB a shard).
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifacts }}check-[0-9]*
          path: shards
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-shards
          path: shards/check-shards
      - name: Merge
        env:
          BUILD: ${{ needs.plan.outputs.build || format('artifact {0}', inputs.build-artifact) }}
          ORIGINAL: ${{ needs.original.outputs.id }}
        run: |
          set -euo pipefail
          # A shard that wrote no report has each of its routes listed as not checked.
          node scripts/check-shards.ts merge shards merged shards/check-shards --original "$ORIGINAL"
          reported=$(find shards -name report.json | wc -l)
          { echo "### $SITE: $BUILD"; echo; echo "$reported of $SHARDS shards reported."; echo; cat merged/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      # Every shard's kept results in one entry, which the next run's shards restore whatever way it deals the routes.
      - name: The old side as earlier runs joined it
        uses: actions/cache/restore@v4
        with:
          path: old-joined
          key: check-old-joined-${{ env.SITE }}-${{ github.run_id }}
          restore-keys: check-old-joined-${{ env.SITE }}-
      - name: Join the old side
        run: |
          mkdir -p old-earlier && if [ -d old-joined ]; then mv old-joined old-earlier/; fi
          node scripts/check-shards.ts join-old old-earlier old-joined >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-shards.ts join-old shards old-joined >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        with:
          path: old-joined
          key: check-old-joined-${{ env.SITE }}-${{ github.run_id }}
      - name: Join kept results
        if: inputs.reuse != 'false'
        run: node scripts/check-shards.ts keep shards reuse >> "$GITHUB_STEP_SUMMARY"
      - name: Keep results for later runs
        if: inputs.reuse != 'false'
        uses: actions/cache/save@v4
        with:
          path: reuse
          key: check-reuse-${{ env.SITE }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifacts }}check-merged
          path: merged
          retention-days: 30
      - name: Every route checked to the end
        run: node scripts/check-shards.ts gate merged
      # A shard that kept results or recorded old pages, but whose artifact holds none, lost them on upload: a silent cold start.
      - name: Every shard uploaded what it kept
        if: always()
        run: node scripts/check-shards.ts uploaded shards
